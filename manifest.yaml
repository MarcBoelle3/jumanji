# yaml-language-server: $schema=https://instadeep.aichor.ai/schema/latest/manifest.schema.json

kind: AIchorManifest
apiVersion: 0.2.2

builder:
  image: jumanji-image
  dockerfile: ./Dockerfile
  context: .

spec:
  operator: jax
  image: jumanji-image
  command: "PYTHONPATH=. python3 -u examples/train_agent.py"

  tensorboard: # optional, disabled by default
    enabled: true

  types:
    Worker:
      count: 2
      resources:
        cpus: 16
        ramRatio: 3

        # machineName: "dgx" # optional
        shmSizeGB: 48 # optional

        accelerators: # optional
          gpu:
            count: 1
            product: Tesla-V100-SXM3-32GB
            type: gpu
